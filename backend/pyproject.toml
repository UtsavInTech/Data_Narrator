[project]
name = "datanarrator"
version = "0.2.0"
description = "Point it at any Excel file, cloud folder or database and get plain-language insights."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "duckdb>=1.2",
    "pandas>=2.2",
    "pyarrow>=16",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
excel-legacy = ["xlrd>=2.0", "pyxlsb>=1.0", "odfpy>=1.4"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datanarrator*"]
